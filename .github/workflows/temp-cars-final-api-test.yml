name: Temp Cars Final API Test

on:
  push:

jobs:
  final:
    runs-on: ubuntu-latest
    steps:
      - name: Test deployed Cars API
        env:
          SITE: https://worth-it-calculator.pages.dev
        run: |
          node <<'NODE'
          (async () => {
            const cases = [
              ['car','Honda','Civic'],
              ['van','Mercedes-Benz','Sprinter'],
              ['truck','MAN','TGL'],
              ['bus','Wrightbus','StreetDeck'],
              ['motorcycle','BMW','R1300GS']
            ];

            let failures = 0;

            for (const [kind,make,model] of cases) {
              const u =
                new URL(process.env.SITE + '/api/cars');

              u.searchParams.set('action','details');
              u.searchParams.set('kind',kind);
              u.searchParams.set('make',make);
              u.searchParams.set('model',model);
              u.searchParams.set('v','final-api-test-1');

              const response =
                await fetch(u, {
                  headers: {
                    accept: 'application/json'
                  }
                });

              const data =
                await response.json();

              const description =
                String(
                  data?.wikipedia?.description || ''
                ).trim();

              const specs =
                Object.entries(
                  data?.specifications || {}
                )
                .filter(([,value]) =>
                  value !== null &&
                  value !== undefined &&
                  String(value).trim() &&
                  !/^no information$/i.test(
                    String(value).trim()
                  )
                );

              const image =
                Boolean(data?.image?.url);

              const hasMeaningfulInfo =
                description.length >= 40 ||
                specs.length > 0 ||
                image;

              const external =
                data?.external?.fuelEconomy || null;

              console.log(
                JSON.stringify(
                  {
                    kind,
                    make,
                    model,
                    status: response.status,
                    success: data?.success === true,
                    wikipediaTitle:
                      data?.wikipedia?.title || null,
                    descriptionLength:
                      description.length,
                    image,
                    imageProvider:
                      data?.image?.source_provider || 'Wikimedia',
                    specificationCount:
                      specs.length,
                    epa:
                      external
                        ? {
                            year: external.year,
                            fuelType: external.fuelType,
                            combinedMpg: external.combinedMpg,
                            cityMpg: external.cityMpg,
                            highwayMpg: external.highwayMpg
                          }
                        : null
                  },
                  null,
                  2
                )
              );

              if (
                response.status !== 200 ||
                data?.success !== true ||
                !hasMeaningfulInfo
              ) {
                failures++;
              }

              await new Promise(r => setTimeout(r, 150));
            }

            if (failures) {
              process.exit(1);
            }
          })().catch(error => {
            console.error(error);
            process.exit(1);
          });
          NODE
