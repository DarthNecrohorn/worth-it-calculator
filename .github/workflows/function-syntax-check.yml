name: Worth It JavaScript syntax check

on:
  pull_request:
    paths:
      - "functions/**/*.js"
      - "supabase/**/*.sql"
      - "tests/**/*.mjs"
      - "tests/fixtures/**/*.sql"
      - "cars-ui.js"
      - "ship-tracking-ui.js"
      - "profile-ui.js"
      - "app.js"
      - "index.html"
      - "settings.js"
      - "community-features.js"
      - "community-features.css"
      - "style.css"
      - "web-shop.css"
      - "tests/community-features.test.mjs"
      - "tests/settings-navigation.test.mjs"
      - "chat-ui.js"
      - "chat-enhancements.js"
      - "docs/chat-calls-turn-setup.md"
      - "_redirects"
      - "markets-ui.js"
      - "crypto-ui.js"
      - "shop.js"
      - "calc-economy.js"
      - "functions/api/guest-calc.js"
      - "functions/api/ugc-maker.js"
      - "ugc-calculators.js"
      - "ugc-calculators.css"
      - "supabase/worth-it-ugc-badges.sql"
      - "supabase/worth-it-ugc-maker-generation-refunds.sql"
      - "supabase/worth-it-ugc-unique-views.sql"
      - "supabase/worth-it-creator-leaderboards.sql"
      - "supabase/worth-it-ugc-enhancements.sql"
      - "supabase/worth-it-ugc-security-hardening.sql"
      - "supabase/worth-it-ugc-pagination.sql"
      - "supabase/worth-it-ugc-visibility-categories-drafts.sql"
      - "supabase/worth-it-ugc-publish-notifications.sql"
      - "supabase/worth-it-ugc-reaction-policy.sql"
      - "supabase/worth-it-ugc-reaction-policy-owner-privacy.sql"
      - "supabase/worth-it-ugc-creator-earnings.sql"
      - "supabase/worth-it-ugc-creator-earnings-price-cap.sql"
      - "supabase/worth-it-ugc-pricing.sql"
      - "supabase/worth-it-ugc-reaction-policy-owner-privacy.sql"
      - "supabase/worth-it-community-theme-hover.sql"
      - "supabase/calc-economy-followup.sql"
      - "tests/ugc-calculators.test.mjs"
      - "tests/fixtures/ugc-badges-postgres-setup.sql"
      - "tests/fixtures/ugc-creator-earnings-pre-migration.sql"
      - "tests/fixtures/ugc-unique-views-pre-migration.sql"
      - "tests/fixtures/ugc-badges-postgres-smoke.sql"
      - "tests/guest-calc.test.mjs"
      - "tests/guest-lite.test.mjs"
      - "tests/calc-economy.test.mjs"
      - "web-shop.css"
      - "routing.js"
      - "guest-mode.js"
      - "section-data-cache.js"
      - ".github/workflows/function-syntax-check.yml"

jobs:
  syntax:
    name: Parse JavaScript and check migration delimiters
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run community features contract tests
        run: node --test tests/community-features.test.mjs

      - name: Run UGC calculator and badge contract tests
        run: node --test tests/ugc-calculators.test.mjs

      - name: Run deployment-specific Supabase configuration tests
        run: node --test tests/runtime-config.test.mjs

      - name: Run CALC economy contract tests
        run: node --test tests/calc-economy.test.mjs

      - name: Run Guest Lite D1 session tests
        run: node --test tests/guest-calc.test.mjs

      - name: Run chat enhancement regression tests
        run: node --test tests/worth-it-chat-enhancements.test.mjs

      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            echo "Checking $file"
            node --input-type=module --check < "$file"
          done < <(find functions -type f -name '*.js' -print0)
          for file in cars-ui.js markets-ui.js crypto-ui.js shop.js calc-economy.js community-features.js ugc-calculators.js ship-tracking-ui.js app.js settings.js admin-panel.js profile-ui.js chat-ui.js chat-enhancements.js routing.js guest-mode.js section-data-cache.js; do
            if [[ -f "$file" ]]; then
              echo "Checking $file"
              node --input-type=module --check < "$file"
            fi
          done

      - name: Test account-data API security paths
        run: node --test tests/*.test.mjs

      - name: Set up Python for PostgreSQL parsing
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install pinned PostgreSQL parser
        run: python -m pip install "pglast==7.20"

      - name: Parse migration SQL with PostgreSQL grammar
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from pglast import parse_sql

          for name in ("supabase/worth-it-settings-privacy-notifications.sql", "supabase/worth-it-chat-video-media.sql", "supabase/worth-it-chat-message-actions.sql", "supabase/worth-it-chat-message-delete-constraint.sql", "supabase/worth-it-chat-message-action-indexes.sql", "supabase/worth-it-chat-realtime.sql", "supabase/worth-it-chat-enhancements.sql", "supabase/worth-it-chat-call-reliability.sql", "supabase/worth-it-chat-private-media.sql", "supabase/calc-economy.sql", "supabase/calc-wallet-history.sql", "supabase/worth-it-community-extras.sql", "supabase/worth-it-ugc-badges.sql", "supabase/worth-it-ugc-enhancements.sql", "supabase/worth-it-ugc-security-hardening.sql", "supabase/worth-it-ugc-pagination.sql", "supabase/worth-it-ugc-visibility-categories-drafts.sql", "supabase/worth-it-ugc-publish-notifications.sql", "supabase/worth-it-ugc-profile-cards.sql", "supabase/worth-it-ugc-reaction-policy.sql", "supabase/worth-it-ugc-reaction-policy-owner-privacy.sql", "supabase/worth-it-community-theme-hover.sql", "supabase/worth-it-community-theme-header.sql", "supabase/worth-it-community-theme-design-system.sql", "supabase/worth-it-community-theme-premium-gate.sql", "supabase/calc-economy-followup.sql", "supabase/worth-it-ugc-unique-views.sql", "supabase/worth-it-creator-leaderboards.sql", "supabase/worth-it-ugc-creator-earnings.sql", "supabase/worth-it-ugc-creator-earnings-price-cap.sql", "supabase/worth-it-ugc-pricing.sql", "supabase/worth-it-ugc-maker-generation-refunds.sql"):
              path = Path(name)
              sql = path.read_text(encoding="utf-8")
              statements = parse_sql(sql)
              if not statements:
                  raise SystemExit(f"No SQL statements were found in {path}.")
              print(f"PostgreSQL parser accepted {len(statements)} statements in {path}.")
          PY

      - name: Check Supabase SQL migration delimiters
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          from collections import Counter

          for name in ("supabase/worth-it-settings-privacy-notifications.sql", "supabase/worth-it-chat-video-media.sql", "supabase/worth-it-chat-message-actions.sql", "supabase/worth-it-chat-message-delete-constraint.sql", "supabase/worth-it-chat-message-action-indexes.sql", "supabase/worth-it-chat-enhancements.sql", "supabase/worth-it-chat-call-reliability.sql", "supabase/calc-economy.sql", "supabase/calc-wallet-history.sql", "supabase/worth-it-community-extras.sql", "supabase/worth-it-ugc-badges.sql", "supabase/worth-it-ugc-enhancements.sql", "supabase/worth-it-ugc-security-hardening.sql", "supabase/worth-it-ugc-pagination.sql", "supabase/worth-it-ugc-visibility-categories-drafts.sql", "supabase/worth-it-ugc-publish-notifications.sql", "supabase/worth-it-ugc-profile-cards.sql", "supabase/worth-it-ugc-reaction-policy.sql", "supabase/worth-it-ugc-reaction-policy-owner-privacy.sql", "supabase/worth-it-community-theme-hover.sql", "supabase/worth-it-community-theme-header.sql", "supabase/worth-it-community-theme-design-system.sql", "supabase/worth-it-community-theme-premium-gate.sql", "supabase/calc-economy-followup.sql", "supabase/worth-it-ugc-unique-views.sql", "supabase/worth-it-creator-leaderboards.sql", "supabase/worth-it-ugc-creator-earnings.sql", "supabase/worth-it-ugc-creator-earnings-price-cap.sql", "supabase/worth-it-ugc-pricing.sql", "supabase/worth-it-ugc-maker-generation-refunds.sql"):
              path = Path(name)
              sql = path.read_text(encoding="utf-8")
              # Count each dollar-quote delimiter independently. Function definitions may
              # put "as $" on the same line as the language/options, while embedded
              # $old$/$new$ fragments inside the migration's DO block are valid nested text.
              counts = Counter(re.findall(r"\$\$|\$[A-Za-z_][A-Za-z_0-9]*\$", sql))
              unpaired = {tag: count for tag, count in counts.items() if count % 2}
              malformed = re.findall(r"(?m)^\s*\$;\s*$", sql)
              if unpaired or malformed:
                  raise SystemExit(
                      f"Invalid SQL dollar-quote delimiters in {path}: unpaired tags {unpaired}, "
                      f"{len(malformed)} malformed terminator(s)."
                  )
              if name.endswith("worth-it-settings-privacy-notifications.sql") and (
                  not re.search(r"(?im)^\s*begin;\s*$", sql) or not re.search(r"(?im)^\s*commit;\s*$", sql)
              ):
                  raise SystemExit("Expected the Settings migration to be wrapped in BEGIN/COMMIT.")
              print(f"Checked SQL dollar-quote delimiters in {path}: {sum(counts.values()) // 2} paired delimiters.")
          PY

  migration-postgres:
    name: Execute and smoke-test Settings migration in disposable PostgreSQL
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Prepare PostgreSQL client from service container
        env:
          POSTGRES_SERVICE_CONTAINER: ${{ job.services.postgres.id }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${POSTGRES_SERVICE_CONTAINER:-}" ]]; then
            echo "::error::PostgreSQL service container ID is unavailable."
            exit 1
          fi

          # The postgres:16 service image already includes psql and createdb.
          # Use those binaries instead of downloading Ubuntu packages on the runner.
          docker exec "$POSTGRES_SERVICE_CONTAINER" psql --version
          docker exec "$POSTGRES_SERVICE_CONTAINER" createdb --version

          # Copy the checked-out SQL fixtures/migrations into the isolated service
          # container so psql can read its -f paths from the same workspace.
          docker exec "$POSTGRES_SERVICE_CONTAINER" mkdir -p /tmp/worth-it-ci
          docker cp "$GITHUB_WORKSPACE/." "$POSTGRES_SERVICE_CONTAINER:/tmp/worth-it-ci/"

          client_bin="$RUNNER_TEMP/postgres-client-bin"
          mkdir -p "$client_bin"

          cat > "$client_bin/psql" <<'PSQL_WRAPPER'
          #!/usr/bin/env bash
          set -euo pipefail
          : "${POSTGRES_SERVICE_CONTAINER:?Missing PostgreSQL service container ID}"
          exec docker exec -w /tmp/worth-it-ci "$POSTGRES_SERVICE_CONTAINER" psql "$@"
          PSQL_WRAPPER

          cat > "$client_bin/createdb" <<'CREATEDB_WRAPPER'
          #!/usr/bin/env bash
          set -euo pipefail
          : "${POSTGRES_SERVICE_CONTAINER:?Missing PostgreSQL service container ID}"
          exec docker exec -w /tmp/worth-it-ci "$POSTGRES_SERVICE_CONTAINER" createdb "$@"
          CREATEDB_WRAPPER

          chmod +x "$client_bin/psql" "$client_bin/createdb"
          echo "$client_bin" >> "$GITHUB_PATH"
          echo "POSTGRES_SERVICE_CONTAINER=$POSTGRES_SERVICE_CONTAINER" >> "$GITHUB_ENV"

      - name: Create isolated baseline schema fixture
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
        run: psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/fixtures/settings-migration-postgres-setup.sql

      - name: Execute the Settings migration against PostgreSQL
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
        run: psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/worth-it-settings-privacy-notifications.sql

      - name: Confirm the migration can be safely retried
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
        run: psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/worth-it-settings-privacy-notifications.sql

      - name: Apply follow-up account-data privilege hardening
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
        run: psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/worth-it-account-data-privileges.sql

      - name: Smoke-test privacy, notifications, chat presence, privileges and account-data access
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
        run: psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/fixtures/settings-migration-postgres-smoke.sql

      - name: Create isolated database for chat-video migration tests
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
        run: createdb --maintenance-db="$TEST_DATABASE_URL" --owner=postgres chat_video_test

      - name: Execute chat-video migration against disposable PostgreSQL
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/chat_video_test
        run: |
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/fixtures/chat-video-migration-postgres-setup.sql
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/worth-it-chat-video-media.sql
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/fixtures/chat-video-migration-postgres-smoke.sql

      - name: Create isolated database for chat-enhancements migration tests
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
        run: createdb --maintenance-db="$TEST_DATABASE_URL" --owner=postgres worth_it_chat_enhancements_test

      - name: Execute and smoke-test chat-enhancements migration in isolated PostgreSQL
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/worth_it_chat_enhancements_test
        run: |
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/fixtures/chat-enhancements-migration-postgres-setup.sql
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/worth-it-chat-enhancements.sql
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/fixtures/chat-enhancements-migration-postgres-smoke.sql
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/worth-it-chat-call-reliability.sql
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/worth-it-chat-call-reliability.sql
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/fixtures/chat-call-reliability-postgres-smoke.sql

      - name: Create isolated database for chat message action tests
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
        run: createdb --maintenance-db="$TEST_DATABASE_URL" --owner=postgres worth_it_chat_actions_test

      - name: Apply chat message actions and foreign-key indexes
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/worth_it_chat_actions_test
        run: |
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/fixtures/chat-message-actions-postgres-setup.sql
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/worth-it-chat-message-actions.sql
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/worth-it-chat-message-delete-constraint.sql
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/worth-it-chat-message-action-indexes.sql
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/fixtures/chat-message-actions-postgres-smoke.sql

      - name: Create isolated database for private chat media tests
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
        run: createdb --maintenance-db="$TEST_DATABASE_URL" --owner=postgres worth_it_chat_private_media_test

      - name: Apply and smoke-test private chat media migration
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/worth_it_chat_private_media_test
        run: |
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/fixtures/chat-private-media-postgres-setup.sql
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/worth-it-chat-message-actions.sql
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/worth-it-chat-message-delete-constraint.sql
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/fixtures/chat-private-media-post-actions.sql
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/worth-it-chat-private-media.sql
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/fixtures/chat-private-media-postgres-smoke.sql

      - name: Create isolated database for community feature migration tests
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
        run: createdb --maintenance-db="$TEST_DATABASE_URL" --owner=postgres worth_it_community_features_test

      - name: Apply, retry and smoke-test community features migration
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/worth_it_community_features_test
        run: |
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/fixtures/community-features-postgres-setup.sql
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/worth-it-community-extras.sql
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/worth-it-community-extras.sql
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/worth-it-community-theme-hover.sql
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/worth-it-community-theme-hover.sql
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/worth-it-community-theme-header.sql
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/worth-it-community-theme-header.sql
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/worth-it-community-theme-design-system.sql
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/worth-it-community-theme-design-system.sql
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/fixtures/community-features-postgres-smoke.sql

      - name: Create isolated database for CALC economy tests
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
        run: createdb --maintenance-db="$TEST_DATABASE_URL" --owner=postgres worth_it_calc_economy_test

      - name: Apply, retry and smoke-test CALC economy migration
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/worth_it_calc_economy_test
        run: |
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/fixtures/calc-economy-postgres-setup.sql
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/calc-economy.sql
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/calc-economy.sql
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/worth-it-community-theme-premium-gate.sql
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/worth-it-community-theme-premium-gate.sql
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/calc-wallet-history.sql
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/calc-wallet-history.sql
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/calc-economy-followup.sql
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/calc-economy-followup.sql
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/fixtures/calc-economy-postgres-smoke.sql


      - name: Create isolated database for UGC calculators and member badges
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
        run: createdb --maintenance-db="$TEST_DATABASE_URL" --owner=postgres worth_it_ugc_badges_test

      - name: Apply, retry and smoke-test UGC calculators and member badges migration
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/worth_it_ugc_badges_test
        run: |
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/fixtures/ugc-badges-postgres-setup.sql
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/worth-it-ugc-badges.sql
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/worth-it-ugc-badges.sql
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/worth-it-ugc-maker-generation-refunds.sql
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/worth-it-ugc-maker-generation-refunds.sql
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -c "ALTER TABLE private.worth_it_user_calculators ADD COLUMN IF NOT EXISTS usage_price_milli integer NOT NULL DEFAULT 100 CHECK (usage_price_milli BETWEEN 100 AND 500 AND usage_price_milli % 10 = 0);"
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/worth-it-ugc-enhancements.sql
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/worth-it-ugc-enhancements.sql
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/worth-it-ugc-security-hardening.sql
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/worth-it-ugc-security-hardening.sql
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/worth-it-ugc-pagination.sql
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/worth-it-ugc-pagination.sql
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/worth-it-ugc-visibility-categories-drafts.sql
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/worth-it-ugc-visibility-categories-drafts.sql
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/worth-it-ugc-publish-notifications.sql
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/worth-it-ugc-publish-notifications.sql
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/worth-it-ugc-profile-cards.sql
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/worth-it-ugc-profile-cards.sql
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/worth-it-ugc-pricing.sql
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/worth-it-ugc-pricing.sql
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/worth-it-ugc-reaction-policy.sql
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/worth-it-ugc-reaction-policy.sql
