name: Worth It JavaScript syntax check

on:
  pull_request:
    paths:
      - "functions/**/*.js"
      - "supabase/**/*.sql"
      - "tests/**/*.mjs"
      - "tests/fixtures/**/*.sql"
      - "cars-ui.js"
      - "ship-tracking-ui.js"
      - "profile-ui.js"
      - "app.js"
      - "index.html"
      - "settings.js"
      - "chat-ui.js"
      - "chat-enhancements.js"
      - "docs/chat-calls-turn-setup.md"
      - "_redirects"
      - "markets-ui.js"
      - "routing.js"
      - "guest-mode.js"
      - "section-data-cache.js"
      - ".github/workflows/function-syntax-check.yml"

jobs:
  syntax:
    name: Parse JavaScript and check migration delimiters
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run chat enhancement regression tests
        run: node --test tests/worth-it-chat-enhancements.test.mjs

      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            echo "Checking $file"
            node --input-type=module --check < "$file"
          done < <(find functions -type f -name '*.js' -print0)
          for file in cars-ui.js markets-ui.js ship-tracking-ui.js app.js settings.js profile-ui.js chat-ui.js chat-enhancements.js routing.js guest-mode.js section-data-cache.js; do
            if [[ -f "$file" ]]; then
              echo "Checking $file"
              node --input-type=module --check < "$file"
            fi
          done

      - name: Test account-data API security paths
        run: node --test tests/*.test.mjs

      - name: Set up Python for PostgreSQL parsing
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install pinned PostgreSQL parser
        run: python -m pip install "pglast==7.20"

      - name: Parse migration SQL with PostgreSQL grammar
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from pglast import parse_sql

          for name in ("supabase/worth-it-settings-privacy-notifications.sql", "supabase/worth-it-chat-video-media.sql", "supabase/worth-it-chat-message-actions.sql", "supabase/worth-it-chat-message-delete-constraint.sql", "supabase/worth-it-chat-message-action-indexes.sql", "supabase/worth-it-chat-realtime.sql", "supabase/worth-it-chat-enhancements.sql", "supabase/worth-it-chat-call-reliability.sql", "supabase/worth-it-chat-call-reliability.sql"):
              path = Path(name)
              sql = path.read_text(encoding="utf-8")
              statements = parse_sql(sql)
              if not statements:
                  raise SystemExit(f"No SQL statements were found in {path}.")
              print(f"PostgreSQL parser accepted {len(statements)} statements in {path}.")
          PY

      - name: Check Supabase SQL migration delimiters
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          from collections import Counter

          for name in ("supabase/worth-it-settings-privacy-notifications.sql", "supabase/worth-it-chat-video-media.sql", "supabase/worth-it-chat-message-actions.sql", "supabase/worth-it-chat-message-delete-constraint.sql", "supabase/worth-it-chat-message-action-indexes.sql", "supabase/worth-it-chat-enhancements.sql", "supabase/worth-it-chat-call-reliability.sql"):
              path = Path(name)
              sql = path.read_text(encoding="utf-8")
              # Count each dollar-quote delimiter independently. Function definitions may
              # put "as $" on the same line as the language/options, while embedded
              # $old$/$new$ fragments inside the migration's DO block are valid nested text.
              counts = Counter(re.findall(r"\$\$|\$[A-Za-z_][A-Za-z_0-9]*\$", sql))
              unpaired = {tag: count for tag, count in counts.items() if count % 2}
              malformed = re.findall(r"(?m)^\s*\$;\s*$", sql)
              if unpaired or malformed:
                  raise SystemExit(
                      f"Invalid SQL dollar-quote delimiters in {path}: unpaired tags {unpaired}, "
                      f"{len(malformed)} malformed terminator(s)."
                  )
              if name.endswith("worth-it-settings-privacy-notifications.sql") and (
                  not re.search(r"(?im)^\s*begin;\s*$", sql) or not re.search(r"(?im)^\s*commit;\s*$", sql)
              ):
                  raise SystemExit("Expected the Settings migration to be wrapped in BEGIN/COMMIT.")
              print(f"Checked SQL dollar-quote delimiters in {path}: {sum(counts.values()) // 2} paired delimiters.")
          PY

  migration-postgres:
    name: Execute and smoke-test Settings migration in disposable PostgreSQL
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client

      - name: Create isolated baseline schema fixture
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
        run: psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/fixtures/settings-migration-postgres-setup.sql

      - name: Execute the Settings migration against PostgreSQL
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
        run: psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/worth-it-settings-privacy-notifications.sql

      - name: Confirm the migration can be safely retried
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
        run: psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/worth-it-settings-privacy-notifications.sql

      - name: Apply follow-up account-data privilege hardening
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
        run: psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/worth-it-account-data-privileges.sql

      - name: Smoke-test privacy, notifications, chat presence, privileges and account-data access
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
        run: psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/fixtures/settings-migration-postgres-smoke.sql

      - name: Create isolated database for chat-video migration tests
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
        run: createdb --maintenance-db="$TEST_DATABASE_URL" --owner=postgres chat_video_test

      - name: Execute chat-video migration against disposable PostgreSQL
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/chat_video_test
        run: |
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/fixtures/chat-video-migration-postgres-setup.sql
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/worth-it-chat-video-media.sql
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/fixtures/chat-video-migration-postgres-smoke.sql

      - name: Create isolated database for chat-enhancements migration tests
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
        run: createdb --maintenance-db="$TEST_DATABASE_URL" --owner=postgres worth_it_chat_enhancements_test

      - name: Execute and smoke-test chat-enhancements migration in isolated PostgreSQL
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/worth_it_chat_enhancements_test
        run: |
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/fixtures/chat-enhancements-migration-postgres-setup.sql
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/worth-it-chat-enhancements.sql
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/fixtures/chat-enhancements-migration-postgres-smoke.sql
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/worth-it-chat-call-reliability.sql
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/worth-it-chat-call-reliability.sql
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/fixtures/chat-call-reliability-postgres-smoke.sql

      - name: Create isolated database for chat message action tests
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
        run: createdb --maintenance-db="$TEST_DATABASE_URL" --owner=postgres worth_it_chat_actions_test

      - name: Apply chat message actions and foreign-key indexes
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/worth_it_chat_actions_test
        run: |
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/fixtures/chat-message-actions-postgres-setup.sql
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/worth-it-chat-message-actions.sql
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/worth-it-chat-message-delete-constraint.sql
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/worth-it-chat-message-action-indexes.sql
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/fixtures/chat-message-actions-postgres-smoke.sql
