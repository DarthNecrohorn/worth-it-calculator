name: Worth It JavaScript syntax check

on:
  pull_request:
    paths:
      - "functions/**/*.js"
      - "cars-ui.js"
      - "ship-tracking-ui.js"
      - "profile-ui.js"
      - "routing.js"
      - ".github/workflows/function-syntax-check.yml"

jobs:
  syntax:
    name: Parse JavaScript
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            echo "Checking $file"
            node --input-type=module --check < "$file"
          done < <(find functions -type f -name '*.js' -print0)
          if [[ -f "cars-ui.js" ]]; then
            echo "Checking cars-ui.js"
            node --input-type=module --check < "cars-ui.js"
          fi
          if [[ -f "ship-tracking-ui.js" ]]; then
            echo "Checking ship-tracking-ui.js"
            node --input-type=module --check < "ship-tracking-ui.js"
          fi
          for file in profile-ui.js routing.js; do
            if [[ -f "$file" ]]; then
              echo "Checking $file"
              node --input-type=module --check < "$file"
            fi
          done
