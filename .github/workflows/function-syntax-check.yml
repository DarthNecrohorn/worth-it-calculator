name: Worth It JavaScript syntax check

on:
  pull_request:
    paths:
      - "functions/**/*.js"
      - "supabase/**/*.sql"
      - "cars-ui.js"
      - "ship-tracking-ui.js"
      - "profile-ui.js"
      - "app.js"
      - "settings.js"
      - "chat-ui.js"
      - "routing.js"
      - ".github/workflows/function-syntax-check.yml"

jobs:
  syntax:
    name: Parse JavaScript and check migration delimiters
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            echo "Checking $file"
            node --input-type=module --check < "$file"
          done < <(find functions -type f -name '*.js' -print0)
          for file in cars-ui.js ship-tracking-ui.js app.js settings.js profile-ui.js chat-ui.js routing.js; do
            if [[ -f "$file" ]]; then
              echo "Checking $file"
              node --input-type=module --check < "$file"
            fi
          done

      - name: Test account-data API security paths
        run: node --test tests/user-data.test.mjs

      - name: Set up Python for PostgreSQL parsing
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install pinned PostgreSQL parser
        run: python -m pip install "pglast==7.20"

      - name: Parse migration SQL with PostgreSQL grammar
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from pglast import parse_sql

          path = Path("supabase/worth-it-settings-privacy-notifications.sql")
          sql = path.read_text(encoding="utf-8")
          statements = parse_sql(sql)
          if not statements:
              raise SystemExit(f"No SQL statements were found in {path}.")
          print(f"PostgreSQL parser accepted {len(statements)} statements in {path}.")
          PY

      - name: Check Supabase SQL migration delimiters
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("supabase/worth-it-settings-privacy-notifications.sql")
          sql = path.read_text(encoding="utf-8")
          openers = len(re.findall(r"(?im)^\s*(?:as|do)\s+\$\$\s*$", sql))
          closers = len(re.findall(r"(?m)^\s*\$\$;\s*$", sql))
          malformed = re.findall(r"(?m)^\s*\$;\s*$", sql)
          if openers != closers or malformed:
              raise SystemExit(
                  f"Invalid SQL dollar-quote delimiters: {openers} openers, {closers} closers, "
                  f"{len(malformed)} malformed terminator(s)."
              )
          if not re.search(r"(?im)^\s*begin;\s*$", sql) or not re.search(r"(?im)^\s*commit;\s*$", sql):
              raise SystemExit("Expected the migration to be wrapped in BEGIN/COMMIT.")
          print(f"Checked SQL dollar-quote delimiters in {path}: {openers} paired blocks.")
          PY
