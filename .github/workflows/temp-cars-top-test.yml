name: Temp Cars Top-Candidate Test

on:
  push:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Test top-ranked Cars candidates
        env:
          SITE: https://worth-it-calculator.pages.dev
        run: |
          node <<'NODE'
          const kinds = ['car','motorcycle','van','truck','bus'];

          async function fetchJson(url) {
            const r = await fetch(url, { headers: { accept: 'application/json' } });
            if (!r.ok) throw new Error(url + ' -> ' + r.status);
            return r.json();
          }

          async function catalog(kind) {
            const [models,makes] = await Promise.all([
              fetchJson(`https://cdn.jsdelivr.net/gh/vehiclesdb/vehiclesdb@latest/catalog/${kind}/models.json`),
              fetchJson(`https://cdn.jsdelivr.net/gh/vehiclesdb/vehiclesdb@latest/catalog/${kind}/makes.json`)
            ]);
            const map = new Map((makes||[]).filter(x=>x?.id).map(x=>[String(x.id),x.name||'']));
            const rows=[];
            const seen=new Set();
            for(const x of models||[]){
              const make=map.get(String(x?.make_id||''))||x?.make_name||x?.make||'';
              const model=x?.name||'';
              if(!make||!model) continue;
              const key=(make+'|'+model).toLowerCase();
              if(seen.has(key)) continue;
              seen.add(key);
              const decile=Number(x?.popularity?.global_decile ?? x?.global_decile ?? x?.global_popularity_decile ?? 999);
              rows.push({make,model,decile:Number.isFinite(decile)?decile:999});
            }
            rows.sort((a,b)=>a.decile-b.decile);
            return rows.slice(0,20);
          }

          async function one(kind,v){
            const q=new URLSearchParams({
              action:'details', make:v.make, model:v.model, kind,
              image_only:'1', v:'top-test-2'
            });
            const r=await fetchJson(`${process.env.SITE}/api/cars?${q}`);
            const desc=String(r?.wikipedia?.description||'').trim();
            return {
              make:v.make, model:v.model, decile:v.decile,
              title:r?.wikipedia?.title||'No Information',
              image:Boolean(r?.image?.url),
              desc:desc.length>=40&&!/^no information$/i.test(desc),
              descLen:desc.length,
              verified:r?.image?.identity_verified===true
            };
          }

          const report=[];
          for(const kind of kinds){
            const top=await catalog(kind);
            const rows=[];
            for(let i=0;i<top.length;i+=5){
              const chunk=top.slice(i,i+5);
              rows.push(...await Promise.all(chunk.map(v=>one(kind,v))));
            }
            report.push({kind,rows});
          }

          console.log(JSON.stringify(report,null,2));
          for(const r of report){
            const usable=r.rows.filter(x=>x.desc).length;
            const images=r.rows.filter(x=>x.image).length;
            console.log(`${r.kind}: descriptions=${usable}/${r.rows.length}, images=${images}/${r.rows.length}`);
          }
          NODE
