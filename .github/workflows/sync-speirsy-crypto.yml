name: Sync Speirsy Crypto History

on:
  workflow_dispatch:
  schedule:
    - cron: "30 3 * * *"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Worth It
        uses: actions/checkout@v6
        with:
          lfs: false

      - name: Checkout Speirsy dataset
        run: |
          export GIT_LFS_SKIP_SMUDGE=1
          git clone --depth 1 https://github.com/Speirsy11/crypto-dataset.git "${RUNNER_TEMP}/speirsy"

      - name: Pull required Speirsy LFS data
        working-directory: ${{ runner.temp }}/speirsy
        run: |
          git lfs install --local
          git lfs pull --include="data/interval_id=1d/**,data/interval_id=1h/**"
          test -s metadata/manifest.json
          test -f data/interval_id=1d/symbol_id=BTCUSDT/year=2026/month=09/BTCUSDT-1d-2026-09.parquet
          test -f data/interval_id=1h/symbol_id=BTCUSDT/year=2026/month=09/BTCUSDT-1h-2026-09.parquet
          test "$(stat -c%s data/interval_id=1d/symbol_id=BTCUSDT/year=2026/month=09/BTCUSDT-1d-2026-09.parquet)" -gt 1024
          test "$(stat -c%s data/interval_id=1h/symbol_id=BTCUSDT/year=2026/month=09/BTCUSDT-1h-2026-09.parquet)" -gt 1024

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Parquet reader
        run: python -m pip install --disable-pip-version-check pyarrow

      - name: Sync Speirsy CC0 history
        env:
          SPEIRSY_ROOT: ${{ runner.temp }}/speirsy
        run: python scripts/sync-speirsy-crypto.py

      - name: Commit updated history
        run: |
          git config user.name "Worth It Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- data/crypto-history; then
            echo "No Speirsy updates."
            exit 0
          fi
          git add data/crypto-history
          git commit -m "Update Speirsy crypto history"
          git push
