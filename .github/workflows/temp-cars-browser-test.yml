name: Temp Cars Browser Test

on:
  push:

jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1

      - name: Inspect live Cars UI
        env:
          SITE: https://worth-it-calculator.pages.dev
        run: |
          node <<'NODE'
          (async () => {
            const { chromium } = require('playwright');

            const browser =
              await chromium.launch({ headless: true });

            const page =
              await browser.newPage({
                viewport: {
                  width: 1440,
                  height: 1200
                }
              });

            page.on('console', msg => {
              if (msg.type() === 'error') {
                console.log(
                  '[browser console error]',
                  msg.text()
                );
              }
            });

            page.on('pageerror', error => {
              console.log(
                '[browser page error]',
                String(error)
              );
            });

            await page.goto(
              process.env.SITE,
              {
                waitUntil: 'domcontentloaded',
                timeout: 60000
              }
            );

            await page.waitForTimeout(4000);

            const inspect = async label => {
              const cards =
                await page
                  .locator('#popularCarsGrid .car-card')
                  .all();

              const rows = [];

              for (
                let i = 0;
                i < Math.min(cards.length, 12);
                i++
              ) {
                rows.push(
                  await cards[i].evaluate(
                    el => ({
                      text: el.innerText,
                      info:
                        el.querySelector(
                          '.car-card-info-preview'
                        )?.textContent || null,
                      infoState:
                        el.dataset.infoState || null,
                      imageState:
                        el.dataset.imageState || null,
                      image:
                        Boolean(
                          el.querySelector(
                            'img.car-card-image'
                          )
                        ),
                      imageSrc:
                        el.querySelector(
                          'img.car-card-image'
                        )?.getAttribute('src') || null
                    })
                  )
                );
              }

              console.log(
                JSON.stringify(
                  {
                    label,
                    cards: cards.length,
                    rows
                  },
                  null,
                  2
                )
              );

              return {
                cards,
                rows
              };
            };

            const initial =
              await inspect('initial');

            const buttons =
              await page.locator('button').allTextContents();

            console.log(
              'BUTTONS',
              JSON.stringify(
                buttons.filter(Boolean).slice(0, 120)
              )
            );

            const exploreVans =
              page.getByText(
                'Explore vans',
                { exact: true }
              );

            if (
              await exploreVans.count()
            ) {
              await exploreVans.first().click();
              await page.waitForTimeout(4000);
              await inspect('vans-after-click');
            }

            const cards =
              page.locator(
                '#popularCarsGrid .car-card'
              );

            if (
              await cards.count()
            ) {

              await cards.first().click();
              await page.waitForTimeout(3000);

              const modalBody =
                page.locator(
                  '#worthItVehicleModalBody'
                );

              console.log(
                'MODAL',
                JSON.stringify(
                  {
                    visible:
                      await page.locator(
                        '#worthItVehicleDetailsModal.is-open'
                      ).count() > 0,
                    body:
                      (
                        await modalBody
                          .textContent()
                          .catch(() => '')
                      ) || ''
                  },
                  null,
                  2
                )
              );
            }

            await browser.close();
          })().catch(error => {
            console.error(error);
            process.exitCode = 1;
          });
          NODE
