name: Import Awin standard product feeds

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/import-awin-standard-feeds.mjs"
      - "data/shop-shipping-profiles.json"
      - ".github/workflows/awin-standard-feed-import.yml"
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Import Awin feeds
        env:
          AWIN_STYLEVANA_FEED_URL: ${{ secrets.AWIN_STYLEVANA_FEED_URL }}
          AWIN_DOWINX_EU_FEED_URL: ${{ secrets.AWIN_DOWINX_EU_FEED_URL }}
          AWIN_FNTCASE_FEED_URL: ${{ secrets.AWIN_FNTCASE_FEED_URL }}
          AWIN_GIFTLAB_FEED_URL: ${{ secrets.AWIN_GIFTLAB_FEED_URL }}
          AWIN_KING_KOIL_FEED_URL: ${{ secrets.AWIN_KING_KOIL_FEED_URL }}
          AWIN_LUNZO_PL_FEED_URL: ${{ secrets.AWIN_LUNZO_PL_FEED_URL }}
          AWIN_LUNZO_HU_FEED_URL: ${{ secrets.AWIN_LUNZO_HU_FEED_URL }}
          AWIN_GETOUT_FEED_URL: ${{ secrets.AWIN_GETOUT_FEED_URL }}
          AWIN_EVERBLOG_US_FEED_URL: ${{ secrets.AWIN_EVERBLOG_US_FEED_URL }}
          AWIN_PERSONALHOUR_FEED_URL: ${{ secrets.AWIN_PERSONALHOUR_FEED_URL }}
          AWIN_SIMPLE_PROJECT_FEED_URL: ${{ secrets.AWIN_SIMPLE_PROJECT_FEED_URL }}
        run: |
          node scripts/import-awin-standard-feeds.mjs

      - name: Commit updated product snapshot
        run: |
          git add -A data/shop-products-awin.json

          if git diff --cached --quiet; then
            echo "No product snapshot changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update imported Awin standard product feeds"
          git push
