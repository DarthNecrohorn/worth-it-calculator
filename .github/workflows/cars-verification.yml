name: Cars verification

on:
  push:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Parse Cars frontend
        run: node --check cars-ui.js

      - name: Parse Cars API
        run: node --check functions/api/cars.js

      - name: Verify VehiclesDB category counts
        env:
          CATALOG_BASE: https://cdn.jsdelivr.net/gh/vehiclesdb/vehiclesdb@latest/catalog
        run: |
          node <<'NODE'
          const kinds = ["car", "motorcycle", "van", "truck", "bus"];
          const base = process.env.CATALOG_BASE;
          const clean = v => String(v || "").trim().toLowerCase();
          for (const kind of kinds) {
            const response = await fetch(base + "/" + kind + "/models.json");
            if (!response.ok) throw new Error(kind + " catalog HTTP " + response.status);
            const rows = await response.json();
            const unique = new Set();
            for (const row of rows) {
              if (clean(row?.kind) !== kind) {
                throw new Error(kind + " catalog contains record with kind=" + row?.kind);
              }
              if (row?.name && row?.make_id) {
                unique.add(String(row.make_id) + "|" + clean(row.name));
              }
            }
            console.log(kind + ": " + rows.length + " records / " + unique.size + " unique make+model names");
            if (unique.size < 100) {
              throw new Error(kind + " has fewer than 100 unique vehicles");
            }
          }
          NODE
