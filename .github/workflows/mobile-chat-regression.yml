name: Mobile chat layout regression

on:
  pull_request:
    branches: [main]
    paths:
      - "index.html"
      - "style.css"
      - "chat-ux-polish.css"
      - "tests/mobile-chat-shortcut-desktop-fullscreen.test.mjs"
      - "tests/responsive-information-panels.test.mjs"
      - "tests/detail-panels-overlay-layer.test.mjs"
      - ".github/workflows/mobile-chat-regression.yml"
  push:
    branches:
      - fix/mobile-chat-shortcut-desktop-fullscreen-20261025

permissions:
  contents: read

jobs:
  mobile-chat-layout:
    name: Mobile chat shortcut and desktop fullscreen
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run focused layout regression tests
        run: node --test tests/mobile-chat-shortcut-desktop-fullscreen.test.mjs tests/responsive-information-panels.test.mjs tests/detail-panels-overlay-layer.test.mjs
