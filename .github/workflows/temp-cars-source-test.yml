name: Temp Cars Source Test

on:
  push:

jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Syntax checks
        run: |
          node --check functions/api/cars.js
          node --check cars-ui.js

      - name: Verify secondary sources
        run: |
          node <<'NODE'
          (async () => {
            const tests = [
              'https://www.fueleconomy.gov/ws/rest/vehicle/menu/model?year=2024&make=Honda&format=json',
              'https://api.openverse.org/v1/images/?q=Honda%20Civic&page_size=3&mature=false'
            ];

            for (const url of tests) {
              const response =
                await fetch(
                  url,
                  {
                    headers: {
                      accept: 'application/json'
                    }
                  }
                );

              console.log(
                JSON.stringify({
                  url,
                  status: response.status,
                  contentType:
                    response.headers.get('content-type')
                })
              );

              if (!response.ok) {
                process.exit(1);
              }
            }
          })().catch(error => {
            console.error(error);
            process.exit(1);
          });
          NODE
