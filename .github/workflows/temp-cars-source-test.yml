name: Temp Cars Source Test

on:
  push:

jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - name: Verify secondary vehicle sources
        run: |
          node <<'NODE'
          (async () => {
            const tests = [
              'https://www.fueleconomy.gov/ws/rest/vehicle/menu/options?year=2024&make=Honda&model=Civic&format=json',
              'https://api.openverse.org/v1/images/?q=Honda%20Civic&page_size=3&mature=false'
            ];

            for (const url of tests) {
              const response =
                await fetch(
                  url,
                  {
                    headers: {
                      accept: 'application/json'
                    }
                  }
                );

              const text =
                await response.text();

              console.log(
                JSON.stringify(
                  {
                    url,
                    status: response.status,
                    preview: text.slice(0, 4000)
                  },
                  null,
                  2
                )
              );

              if (!response.ok) {
                process.exitCode = 1;
              }
            }
          })().catch(error => {
            console.error(error);
            process.exitCode = 1;
          });
          NODE
